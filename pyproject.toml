[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ideasim"
version = "0.1.0"
description = "Simulator for ideological competition dynamics — replicator-mutator model with dormancy, hybridization, and endogenous environment modification"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "mypy>=1.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
ideasim = "ideasim.cli:main"

[tool.setuptools.packages.find]
include = ["ideasim*"]

[tool.setuptools.package-data]
ideasim = ["data/*.json"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (run with --run-slow or -m slow)",
]
